name: Infection

run-name: Infection run for ${{ github.ref_name }} (${{ github.sha }}) on Nextcloud ${{ inputs.nextcloud_version || 'from info.xml' }} and PHP ${{ inputs.php_version || 'from info.xml' }} using scenario ${{ inputs.scenario }}
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario name
        required: true
        default: default
      nextcloud_version:
        description: Nextcloud server version (branch or tag, e.g. stable31). Empty uses info.xml.
        required: false
        default: ''
      php_version:
        description: PHP version (e.g. 8.3). Empty uses info.xml.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: infection-${{ github.ref }}-nc${{ inputs.nextcloud_version }}-php${{ inputs.php_version }}-${{ inputs.scenario }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-version: ${{ inputs.php_version && format('["{0}"]', inputs.php_version) || steps.versions.outputs.php-available-list }}
      server-max: ${{ inputs.nextcloud_version && format('["{0}"]', inputs.nextcloud_version) || steps.versions.outputs.branches-max-list }}
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@cd0211ffcef1065e2020cd579e4843b8746e7a58 # v1.3.3

  infection:
    runs-on: ubuntu-latest
    needs: matrix
    env:
      APP_NAME: libresign

    strategy:
      matrix:
        php-versions: ${{ fromJson(needs.matrix.outputs.php-version) }}
        server-versions: ${{ fromJson(needs.matrix.outputs.server-max) }}

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          path: apps/${{ env.APP_NAME }}

      - name: Set up PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite, imagick
          coverage: xdebug
          ini-file: development
          ini-values: disable_functions=, memory_limit=2G
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: sudo apt update && sudo apt install poppler-utils

      - name: Install dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer install

      - name: Set up Nextcloud
        env:
          DB_PORT: 4444
        run: |
          mkdir data
          ./occ maintenance:install \
            --verbose \
            --database=sqlite \
            --database-name=nextcloud \
            --database-host=127.0.0.1 \
            --database-port=$DB_PORT \
            --database-user=root \
            --database-pass=rootpassword \
            --admin-user admin \
            --admin-pass admin
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: Infection
        working-directory: apps/${{ env.APP_NAME }}
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          XDEBUG_MODE: coverage
        run: |
          set -o pipefail
          composer mutation:test -- --no-progress --no-interaction 2>&1 | tee infection.log

      - name: Upload Infection log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection-log
          path: apps/${{ env.APP_NAME }}/infection.log
          if-no-files-found: ignore
          retention-days: 7
